name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          # Using API key authentication - add ANTHROPIC_API_KEY to repo secrets
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            This is an FP-FIRST library! Review this pull request focusing on:

            1. **FP PURITY**: Algorithms MUST compose from L0/L1 primitives (fp_reduce_*, fp_fold_*, fp_map_*)
            2. **NO IMPERATIVE LOOPS**: Flag any for/while loops in algorithm hot paths
            3. **NO RAND()**: Flag any rand()/srand() usage - violates deterministic execution
            4. **CONST CORRECTNESS**: All inputs must be const, no mutation
            5. **ASM USAGE**: Check that assembly primitives are actually being called
            6. **Windows x64 ABI**: Verify register preservation (RBX, RBP, R12-R15, XMM6-15)

            Use docs/CLAUDE.md for architecture details. Be strict about FP principles!

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://docs.claude.com/en/docs/claude-code/cli-reference for available options
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'

